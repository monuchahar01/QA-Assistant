version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== Installing dependencies ==="
      - node --version
      - npm --version
      - npm ci

  build:
    commands:
      - echo "=== Building React + Vite app ==="
      - npm run build
      - echo "=== Build complete. Artifacts in dist/ ready for S3 deploy ==="

artifacts:
  files:
    - '**/*'
  base-directory: dist
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
